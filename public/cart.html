
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | 100-Yard Apparel</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css?v=4">
  <link rel="stylesheet" href="css/base.css?v=4">
  <link rel="stylesheet" href="css/components.css?v=5">
  <link rel="stylesheet" href="css/pages.css?v=5">
  <link rel="stylesheet" href="css/cart.css">
</head>

<body>
  <!-- Shared site header and navigation -->
  <header id="site-header" class="site-header"></header>

  <main class="container section">
    <h2>Your Shopping Cart</h2>

    <p id="cart-message">Loading your cart...</p>

    <div id="cart-items"></div>

    <!-- Order Summary -->
    <section class="card cart-summary">
      <h3>Order Summary</h3>

      <p>
        Subtotal:
        <span id="subtotal">₱0.00</span>
      </p>

      <p>Shipping calculated at checkout.</p>

      <button
        id="checkout-button"
        class="btn btn--primary btn--block"
        disabled
      >
        Proceed to Checkout
      </button>
    </section>
  </main>

  <!-- Shared site footer -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- Cart functionality -->
  <script type="module" src="js/cart.js"></script>
</body>
</html>
